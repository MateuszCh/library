<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon"
          type="image/png"
          href="/favicon.png" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Pacifico&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="container"
         id="container"
         style="visibility: hidden;">
        <div class="app-layout">
            <div class="filter-sideber-container">
                <aside class="filter-sidebar"
                       id="filter-sidebar">
                    <div id="listing-filter-chips-sidebar"></div>
                    <div id="listing-sort-sidebar"
                         class="listing-sort-sidebar"></div>
                    <div id="listing-filter-groups"
                         class="listing-filter-groups"></div>
                </aside>
            </div>
            <div class="app-main">
                <div style="display: flex; align-items: baseline; justify-content: space-between;">
                    <h1 class="title"
                        id="title"
                        style="font-size: 64px;">Library</h1>
                    <p class="listing-count"
                       id="listing-count"></p>
                </div>
                <div class="tools"
                     id="tools">
                    <form class="tools-form"
                          onsubmit="event.preventDefault();"
                          id="tools-form"
                          method="POST">
                        <input type="text"
                               class="listing-search"
                               id="listing-search"
                               name="title"
                               placeholder="Title, artist, album, release year, etc." />
                        <div id="listing-filter-button"
                             class="listing-filter-button-container"></div>
                        <div id="listing-sort-button"
                             class="listing-sort-button-container"></div>
                    </form>
                </div>
                <div class="listing">
                    <ul id="listing-results"
                        class="listing-results">
                    </ul>
                </div>
            </div>
        </div>

        <div class="filter-modal-overlay"
             id="filter-modal-overlay">
            <div class="filter-modal">
                <div class="filter-modal-header">
                    <span class="filter-modal-title">Filters</span>
                    <button type="button"
                            class="filter-modal-close"
                            id="filter-modal-close"
                            aria-label="Close filters">✕</button>
                </div>
                <div class="filter-modal-body"
                     id="filter-modal-body"></div>
            </div>
        </div>

        <div class="sort-modal-overlay"
             id="sort-modal-overlay">
            <div class="sort-modal">
                <div class="sort-modal-header">
                    <span class="sort-modal-title">Sort</span>
                    <button type="button"
                            class="sort-modal-close"
                            id="sort-modal-close"
                            aria-label="Close sort">✕</button>
                </div>
                <div class="sort-modal-body"
                     id="sort-modal-body"></div>
            </div>
        </div>
    </div>
    <script type="module"
            src="/src/main.ts"></script>
</body>

</html>
